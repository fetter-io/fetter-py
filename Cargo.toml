[package]
name = "fetter"
version = "4.0.0"
edition = "2021"

[lib]
name = "fetter"
crate-type = ["cdylib"]

[dependencies]
# `generate-import-lib` lets maturin build Windows wheels for Python
# versions whose interpreter isn't physically installed on the runner
# (only 3.10 comes from setup-python). It has no effect on non-Windows
# targets.
pyo3 = { version = "0.28.3", features = ["generate-import-lib"] }
fetter = "4.0.0"
